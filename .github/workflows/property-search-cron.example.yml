name: Scheduled Property Search Cron (Example)

# This workflow demonstrates triggering the protected KotiScout scheduled search endpoint
# via GitHub Actions cron or external scheduler.
#
# Configure CRON_SECRET in your repository secrets.

on:
  schedule:
    # Runs at 08:00, 14:00, 20:00 EET / Finnish Time (06:00, 12:00, 18:00 UTC)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-scheduled-searches:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KotiScout Scheduler Endpoint
        env:
          API_URL: ${{ secrets.KOTISCOUT_API_URL || 'https://api.kotiscout.fi' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not configured. Skipping execution."
            exit 0
          fi
          curl -X POST "$API_URL/internal/jobs/run-scheduled-searches" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
